<!-- LOCKED INPUT -->
@if (locked && state) {
  <div>
    <div
      [id]="id + '-checkbox'"
      class="nggv-field--locked"
      [attr.name]="name"
      [attr.value]="value"
    >
      @if (!labelContentTpl) {
        {{ label }}
      }
      <ng-template
        *ngTemplateOutlet="
          labelContentTpl ?? null;
          context: { $implicit: value }
        "
      ></ng-template>
    </div>
  </div>
}

<!-- INPUT WRAPPER -->
@if (!locked) {
  <div>
    <!-- CHECKBOX FIELD -->
    <label
      [id]="id + '-label'"
      [attr.for]="id + '-checkbox'"
      class="form-control"
      *transloco="let t; read: scope"
    >
      <input
        #input
        type="checkbox"
        [id]="id + '-checkbox'"
        [attr.name]="name"
        [attr.value]="value"
        [attr.required]="required || null"
        [disabled]="disabled"
        [autofocus]="autofocus"
        [attr.aria-label]="description"
        [checked]="state"
        (click)="$event.stopPropagation()"
        (change)="onInputChange($event)"
        (focus)="onFocus($event)"
        (blur)="onBlur($event)"
      />
      <!-- LABEL -->
      <ng-template
        *ngTemplateOutlet="labelContentTpl || basicLabelContentTpl"
      ></ng-template>
      <ng-template #basicLabelContentTpl>
        <!-- to trigger css:empty if no label was added -->
        @if (label) {
          @if (optional === true || (required !== true && optional !== false)) {
            <span class="gds-field-label--optional">
              ({{ t('label.optional') }})
            </span>
          }
          <span>{{ label }}</span>
        }
      </ng-template>
      <i></i>
    </label>
  </div>
  <!-- ERRORS -->
  <ng-container *transloco="let t; read: scope">
    @if (invalid && (error || ngControl?.invalid)) {
      <div class="form-info form-info--error" [attr.for]="id + '-checkbox'">
        <span class="error-icon">
          <gds-icon-triangle-exclamation
            width="16"
            height="16"
            [solid]="true"
            *nggCoreElement
          ></gds-icon-triangle-exclamation>
        </span>
        @if (error) {
          <span [attr.data-thook]="thook + '-errorlabel'">
            {{ error }}
          </span>
        } @else {
          @if (firstError; as error) {
            <span [attr.data-thook]="thook + '-errorlabel'">
              {{ t('error.field' + error?.code, error?.params) }}
            </span>
          }
        }
      </div>
    }
  </ng-container>
  <!-- CHILDREN -->
  <ng-content></ng-content>
}
