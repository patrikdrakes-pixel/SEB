<!-- LOCKED INPUT -->
@if (locked && state) {
  <div>
    <div
      [id]="id + '-radio'"
      class="nggv-field--locked"
      [attr.name]="name"
      [attr.value]="value"
    >
      {{ label }}
      <ng-template
        *ngTemplateOutlet="
          labelContentTpl ?? null;
          context: { $implicit: value }
        "
      ></ng-template>
    </div>
  </div>
}

<!-- INPUT WRAPPER -->
@if (!locked) {
  <div>
    <!-- RADIO BUTTON FIELD -->
    <label [attr.for]="id + '-radio'" class="form-control">
      <input
        #input
        type="radio"
        [attr.id]="id + '-radio'"
        [attr.name]="name"
        [attr.value]="value"
        [attr.required]="required || null"
        [disabled]="disabled"
        [autofocus]="autofocus"
        [attr.aria-label]="description"
        [checked]="state"
        (click)="$event.stopPropagation()"
        (change)="onInputChange($event)"
        (focus)="onFocus($event)"
        (blur)="onBlur($event)"
      />
      <!-- LABEL -->
      {{ label }}
      <ng-template
        *ngTemplateOutlet="
          labelContentTpl ?? null;
          context: { $implicit: value }
        "
      ></ng-template>
      <i></i>
    </label>
  </div>
  <!-- ERRORS -->
  <!-- if no nggv-radio-group is present -->
  @if (!isGroup) {
    <ng-container *transloco="let t; read: scope">
      @if (invalid && (error || ngControl?.invalid)) {
        <div class="form-info form-info--error" [attr.for]="id + '-radio'">
          <span class="error-icon">
            <gds-icon-triangle-exclamation
              width="16"
              height="16"
              [solid]="true"
              *nggCoreElement
            ></gds-icon-triangle-exclamation>
          </span>
          @if (error) {
            <span [attr.data-thook]="thook + '-errorlabel'">
              {{ error }}
            </span>
          } @else {
            @if (firstError; as error) {
              <span [attr.data-thook]="thook + '-errorlabel'">
                {{ t('error.field' + error?.code, error?.params) }}
              </span>
            }
          }
        </div>
      }
    </ng-container>
  }
  <!-- CHILDREN -->
  <ng-content></ng-content>
}
